name: Feature request 💡
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches/mockups welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (React/map)
        - Backend (Flask/API)
        - Recommender pipeline
        - Community features (sharing, comments, badges)
        - Docs / DX
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - label: I would like to work on this myself (good first issue candidate)
