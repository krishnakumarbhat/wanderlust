<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wanderlust AI Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Enable Tailwind class-based dark mode before the CDN evaluates classes
      tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Custom scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Leaflet z-index fixes for sidebar overlay */
      .leaflet-pane {
        z-index: 0;
      }
      .leaflet-control {
        z-index: 10;
      }

      /* Pulsing halo for selected map pins */
      @keyframes pinPulse {
        0% { transform: scale(0.8); opacity: 0.9; }
        70% { transform: scale(1.6); opacity: 0; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .pin-pulse {
        animation: pinPulse 1.6s ease-out infinite;
      }

      /* Dark-mode friendly leaflet popups */
      .dark .leaflet-popup-content-wrapper,
      .dark .leaflet-popup-tip {
        background: #1e293b;
        color: #e2e8f0;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased overflow-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
